<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='14' fill='%23FFB300'/%3E%3Cg stroke='%23FFB300' stroke-width='5' stroke-linecap='round'%3E%3Cline x1='32' y1='4' x2='32' y2='12'/%3E%3Cline x1='32' y1='52' x2='32' y2='60'/%3E%3Cline x1='4' y1='32' x2='12' y2='32'/%3E%3Cline x1='52' y1='32' x2='60' y2='32'/%3E%3Cline x1='12.2' y1='12.2' x2='17.9' y2='17.9'/%3E%3Cline x1='46.1' y1='46.1' x2='51.8' y2='51.8'/%3E%3Cline x1='51.8' y1='12.2' x2='46.1' y2='17.9'/%3E%3Cline x1='17.9' y1='46.1' x2='12.2' y2='51.8'/%3E%3C/g%3E%3C/svg%3E">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunUp - Утренний дайджест</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Наши кастомные стили и анимации -->
    <style>
        body {
            background: linear-gradient(135deg, #e0f7fa 0%, #ffccbc 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
        }
        .btn-hover {
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .btn-hover:hover {
            transform: scale(1.05);
        }
        .form-control:focus {
            border-color: #ff9800;
            box-shadow: 0 0 0 0.2rem rgba(255, 152, 0, 0.25);
        }
        .navbar-custom {
            background-color: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <!-- Шапка сайта (Навигация) -->
    <nav class="navbar navbar-light navbar-custom shadow-sm py-2">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
            <a class="navbar-brand fw-bold fs-4 mb-0" href="/">☀️ SunUp</a>
            <div class="d-flex gap-2">
                <a href="/login/" class="btn btn-outline-dark btn-sm px-3 py-2 btn-hover">Войти</a>
                <a href="/register/" class="btn btn-warning btn-sm px-3 py-2 btn-hover">Регистрация</a>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container mt-3 mt-md-5 px-3">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Блок для скриптов -->
    {% block scripts %}{% endblock %}
</body>
</html>
