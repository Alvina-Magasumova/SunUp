{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card card-hover border-0 shadow-lg p-5">
            <h2 class="text-danger mb-3">❌ Ошибка подтверждения</h2>
            <p class="lead">{{ error }}</p>
            <p>Попробуйте зарегистрироваться заново или запросите новое письмо.</p>
            <a href="/register/" class="btn btn-warning mt-3 btn-hover">Регистрация</a>
        </div>
    </div>
</div>
{% endblock %}
